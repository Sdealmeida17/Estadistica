name: Autograding Tests
on:
  push:
    branches:
      - main
      - feat/solution
  workflow_dispatch:
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: DriverControllerIntegrationTest
        id: driver_controller_integration_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: DriverControllerIntegrationTest
          setup-command: mvn compile
          command: mvn clean test -PDriverControllerIntegrationTest
          timeout: 10
          max-score: 3

      - name: PassengerControllerIntegrationTest
        id: passenger_controller_integration_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: PassengerControllerIntegrationTest
          setup-command: mvn compile
          command: mvn clean test -PPassengerControllerIntegrationTest
          timeout: 10
          max-score: 3

      - name: ReviewControllerIntegrationTest
        id: review_controller_integration_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: ReviewControllerIntegrationTest
          setup-command: mvn compile
          command: mvn clean test -PReviewControllerIntegrationTest
          timeout: 10
          max-score: 3

      - name: RideControllerIntegrationTest
        id: ride_controller_integration_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: RideControllerIntegrationTest
          setup-command: mvn compile
          command: mvn clean test -PRideControllerIntegrationTest
          timeout: 10
          max-score: 4

      - name: DriverDtoValidationTest
        id: driver_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: DriverDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PDriverDtoValidationTest
          timeout: 10
          max-score: 1

      - name: DriverRequestDtoValidationTest
        id: driver_request_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: DriverRequestDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PDriverRequestDtoValidationTest
          timeout: 10
          max-score: 1

      - name: PassengerRequestDtoValidationTest
        id: passenger_request_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: PassengerRequestDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PPassengerRequestDtoValidationTest
          timeout: 10
          max-score: 1

      - name: PassengerLocationDtoValidationTest
        id: passenger_location_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: PassengerLocationDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PPassengerLocationDtoValidationTest
          timeout: 10
          max-score: 1

      - name: ReviewRequestDtoValidationTest
        id: review_request_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: ReviewRequestDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PReviewRequestDtoValidationTest
          timeout: 10
          max-score: 1

      - name: RideRequestDtoValidationTest
        id: ride_request_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: RideRequestDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PRideRequestDtoValidationTest
          timeout: 10
          max-score: 1

      - name: RideResponseDtoValidationTest
        id: ride_response_dto_validation_test
        uses: education/autograding-command-grader@v1
        with:
          test-name: RideResponseDtoValidationTest
          setup-command: mvn compile
          command: mvn clean test -PRideResponseDtoValidationTest
          timeout: 10
          max-score: 1

      - name: Autograding Reporter
        uses: education/autograding-grading-reporter@v1
        env:
          DRIVER_CONTROLLER_INTEGRATION_TEST_RESULTS: "${{steps.driver_controller_integration_test.outputs.result}}"
          PASSENGER_CONTROLLER_INTEGRATION_TEST_RESULTS: "${{steps.passenger_controller_integration_test.outputs.result}}"
          REVIEW_CONTROLLER_INTEGRATION_TEST_RESULTS: "${{steps.review_controller_integration_test.outputs.result}}"
          RIDE_CONTROLLER_INTEGRATION_TEST_RESULTS: "${{steps.ride_controller_integration_test.outputs.result}}"
          DRIVER_DTO_VALIDATION_TEST_RESULTS: "${{steps.driver_dto_validation_test.outputs.result}}"
          DRIVER_REQUEST_DTO_VALIDATION_TEST_RESULTS: "${{steps.driver_request_dto_validation_test.outputs.result}}"
          PASSENGER_REQUEST_DTO_VALIDATION_TEST_RESULTS: "${{steps.passenger_request_dto_validation_test.outputs.result}}"
          PASSENGER_LOCATION_DTO_VALIDATION_TEST_RESULTS: "${{steps.passenger_location_dto_validation_test.outputs.result}}"
          REVIEW_REQUEST_DTO_VALIDATION_TEST_RESULTS: "${{steps.review_request_dto_validation_test.outputs.result}}"
          RIDE_REQUEST_DTO_VALIDATION_TEST_RESULTS: "${{steps.ride_request_dto_validation_test.outputs.result}}"
          RIDE_RESPONSE_DTO_VALIDATION_TEST_RESULTS: "${{steps.ride_response_dto_validation_test.outputs.result}}"
        with:
          runners: driver_controller_integration_test,passenger_controller_integration_test,review_controller_integration_test,ride_controller_integration_test,driver_dto_validation_test,driver_request_dto_validation_test,passenger_request_dto_validation_test,passenger_location_dto_validation_test,review_request_dto_validation_test,ride_request_dto_validation_test,ride_response_dto_validation_test